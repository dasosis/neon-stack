<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Stack</title>
<meta name="description" content="Stack sliding blocks as high as you can. Tap, click or press Space to drop.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='6' y='20' width='20' height='6' fill='%2300e5ff'/><rect x='8' y='13' width='16' height='6' fill='%23b388ff'/><rect x='10' y='6' width='12' height='6' fill='%23ff4081'/></svg>">
<style>
  :root { --fg:#f4f6ff; --dim:#9aa3c7; --accent:#00e5ff; --panel:rgba(10,12,28,.72); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:#070816; color:var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  canvas { display:block; width:100vw; height:100vh; height:100dvh; cursor:pointer; }
  .hud { position:fixed; top:16px; left:0; right:0; text-align:center; pointer-events:none; }
  .score { font-size:64px; font-weight:800; letter-spacing:-2px; text-shadow:0 0 24px rgba(0,229,255,.55); }
  .best { font-size:14px; color:var(--dim); letter-spacing:2px; text-transform:uppercase; }
  .combo { margin-top:6px; font-size:18px; font-weight:700; color:#ffe14d; opacity:0; transition:opacity .2s, transform .2s; transform:scale(.8); }
  .combo.show { opacity:1; transform:scale(1); }
  .mute { position:fixed; top:16px; right:16px; width:40px; height:40px; border-radius:50%;
    border:1px solid rgba(255,255,255,.18); background:var(--panel); color:var(--fg); font-size:18px; cursor:pointer; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; pointer-events:none; }
  .card { background:var(--panel); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:28px 28px 24px; text-align:center;
    max-width:360px; width:100%; pointer-events:auto; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .card h1 { font-size:40px; font-weight:900; letter-spacing:-1px;
    background:linear-gradient(90deg,#00e5ff,#b388ff,#ff4081); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card p { color:var(--dim); margin:10px 0 20px; line-height:1.45; }
  .card .big { font-size:48px; font-weight:800; color:var(--fg); margin:6px 0 2px; }
  .btn { display:inline-block; border:0; border-radius:999px; padding:14px 34px; font-size:18px; font-weight:800; cursor:pointer;
    color:#070816; background:linear-gradient(90deg,#00e5ff,#b388ff); box-shadow:0 0 24px rgba(0,229,255,.45); }
  .btn:active { transform:scale(.97); }
  .hint { font-size:12px; color:var(--dim); margin-top:14px; }
  .hidden { display:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="score" id="score">0</div>
  <div class="best" id="best">Best 0</div>
  <div class="combo" id="combo">PERFECT</div>
</div>
<button class="mute" id="mute" aria-label="Toggle sound">🔊</button>

<div class="overlay" id="start">
  <div class="card">
    <h1>NEON STACK</h1>
    <p>Drop each sliding block onto the tower. Overhangs get sliced off. Land it perfectly to build a combo and win back width.</p>
    <button class="btn" id="playBtn">Play</button>
    <div class="hint">Tap · Click · Space</div>
  </div>
</div>

<div class="overlay hidden" id="over">
  <div class="card">
    <h1>GAME OVER</h1>
    <div class="big" id="finalScore">0</div>
    <p id="finalMsg">Best 0</p>
    <button class="btn" id="againBtn">Play again</button>
    <div class="hint">or press Space</div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best'), comboEl = $('combo');

  // ---- constants (world units) ----
  const BH = 34;            // block height
  const START_W = 300;      // starting block width
  const LIM = 230;          // horizontal travel limit for block center
  const PERFECT = 7;        // tolerance for a perfect drop
  const GRAVITY = 1800;

  let W = 0, H = 0, dpr = 1, scale = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    scale = Math.min(1, W / (LIM * 2 + START_W * 0.6));
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- storage (best score) ----
  const store = {
    get() { try { return +localStorage.getItem('neonstack.best') || 0; } catch { return 0; } },
    set(v) { try { localStorage.setItem('neonstack.best', v); } catch {} }
  };
  let best = store.get();

  // ---- audio ----
  let actx = null, muted = false;
  try { muted = localStorage.getItem('neonstack.muted') === '1'; } catch {}
  $('mute').textContent = muted ? '🔇' : '🔊';
  function tone(freq, dur = 0.12, type = 'triangle', vol = 0.15) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g).connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch {}
  }
  $('mute').addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted;
    $('mute').textContent = muted ? '🔇' : '🔊';
    try { localStorage.setItem('neonstack.muted', muted ? '1' : '0'); } catch {}
  });

  // ---- game state ----
  let state = 'menu';       // menu | play | over
  let stack, cur, debris, fx, cam, camTarget, combo, score, speed, hueBase, dir, shake;

  function hueFor(i) { return (hueBase + i * 9) % 360; }

  function reset() {
    hueBase = Math.random() * 360;
    stack = [];
    for (let i = 0; i < 4; i++) stack.push({ x: -START_W / 2, w: START_W, i: i - 3 });
    debris = []; fx = [];
    cam = camTarget = 0;
    combo = 0; score = 0; speed = 190; dir = 1; shake = 0;
    spawn();
    updateHud();
  }

  function top() { return stack[stack.length - 1]; }

  function spawn() {
    const t = top();
    dir = -dir;
    const cx = dir > 0 ? -LIM : LIM;
    cur = { x: cx - t.w / 2, w: t.w, i: t.i + 1, cx, v: dir * speed };
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = 'Best ' + best;
  }

  let comboTimer = 0;
  function showCombo(text) {
    comboEl.textContent = text;
    comboEl.classList.add('show');
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => comboEl.classList.remove('show'), 900);
  }

  function drop() {
    const t = top();
    let left = Math.max(cur.x, t.x);
    let right = Math.min(cur.x + cur.w, t.x + t.w);
    let overlap = right - left;

    if (overlap <= 0) {
      debris.push(makeDebris(cur.x, cur.w, cur.i, cur.v * 0.4));
      cur = null;
      gameOver();
      return;
    }

    if (Math.abs(cur.x - t.x) <= PERFECT) {
      combo++;
      let w = t.w;
      if (combo >= 3) w = Math.min(START_W, w + 8);   // reward streaks with width
      const x = t.x - (w - t.w) / 2;
      stack.push({ x, w, i: cur.i });
      fx.push({ x, w, i: cur.i, t: 0 });
      tone(440 * Math.pow(2, Math.min(combo, 12) / 12), 0.18, 'sine', 0.2);
      showCombo(combo > 1 ? 'PERFECT ×' + combo : 'PERFECT');
    } else {
      combo = 0;
      // sliced-off piece
      if (cur.x < t.x) debris.push(makeDebris(cur.x, t.x - cur.x, cur.i, -60));
      if (cur.x + cur.w > t.x + t.w) debris.push(makeDebris(t.x + t.w, cur.x + cur.w - (t.x + t.w), cur.i, 60));
      stack.push({ x: left, w: overlap, i: cur.i });
      tone(220 + Math.random() * 40, 0.1, 'square', 0.08);
      shake = 4;
    }

    score++;
    if (score > best) { best = score; store.set(best); }
    speed = Math.min(520, speed + 7);
    camTarget = Math.max(0, (top().i + 1) * BH - H / scale * 0.35);
    updateHud();
    spawn();
  }

  function makeDebris(x, w, i, vx) {
    return { x, w, i, y: i * BH, vx, vy: 0, rot: 0, vr: (Math.random() - 0.5) * 3 * Math.sign(vx || 1) };
  }

  function gameOver() {
    state = 'over';
    tone(160, 0.4, 'sawtooth', 0.12);
    shake = 10;
    $('finalScore').textContent = score;
    $('finalMsg').textContent = score >= best && score > 0 ? 'New best! 🎉' : 'Best ' + best;
    setTimeout(() => { if (state === 'over') $('over').classList.remove('hidden'); }, 600);
  }

  function start() {
    reset();
    state = 'play';
    $('start').classList.add('hidden');
    $('over').classList.add('hidden');
  }

  // ---- input ----
  function action() {
    if (state === 'play') drop();
    else if (state === 'over' && !$('over').classList.contains('hidden')) start();
  }
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); action(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (state === 'menu') start(); else action();
    }
  });
  $('playBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', start);

  // ---- rendering ----
  function sx(x) { return W / 2 + x * scale; }
  function sy(worldY) { return H * 0.78 - (worldY - cam) * scale; }

  function drawBlock(x, i, w, alpha = 1) {
    const h = hueFor(i);
    const X = sx(x), Y = sy((i + 1) * BH), Wp = w * scale, Hp = BH * scale;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = `hsl(${h},85%,55%)`;
    ctx.fillRect(X, Y, Wp, Hp);
    ctx.fillStyle = `hsl(${h},95%,72%)`;
    ctx.fillRect(X, Y, Wp, Math.max(3, Hp * 0.22));
    ctx.fillStyle = `hsla(${h},80%,25%,.55)`;
    ctx.fillRect(X, Y + Hp - Math.max(2, Hp * 0.12), Wp, Math.max(2, Hp * 0.12));
    ctx.globalAlpha = 1;
  }

  function drawBackground() {
    const h = hueFor(stack ? top().i : 0);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${(h + 200) % 360},45%,8%)`);
    g.addColorStop(1, `hsl(${(h + 240) % 360},50%,16%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // parallax stars
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    for (let k = 0; k < 60; k++) {
      const px = (k * 137.5) % W;
      const py = ((k * 89.3 + cam * scale * 0.3) % H + H) % H;
      ctx.fillRect(px, py, (k % 3) + 1, (k % 3) + 1);
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;

    if (state === 'play' && cur) {
      cur.cx += cur.v * dt;
      if (cur.cx > LIM) { cur.cx = LIM; cur.v = -Math.abs(cur.v); }
      if (cur.cx < -LIM) { cur.cx = -LIM; cur.v = Math.abs(cur.v); }
      cur.x = cur.cx - cur.w / 2;
    }
    cam += (camTarget - cam) * Math.min(1, dt * 6);

    for (const d of debris) {
      d.vy -= GRAVITY * dt; d.y += d.vy * dt; d.x += d.vx * dt; d.rot += d.vr * dt;
    }
    debris = debris.filter(d => d.y > cam - H / scale);
    for (const f of fx) f.t += dt;
    fx = fx.filter(f => f.t < 0.5);
    shake *= 0.85;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground();
    if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    if (stack) {
      for (const b of stack) {
        const yTop = sy((b.i + 1) * BH);
        if (yTop > H || yTop < -BH * scale) continue;
        drawBlock(b.x, b.i, b.w);
      }
      for (const f of fx) {
        const p = f.t / 0.5, grow = 18 * p;
        ctx.strokeStyle = `rgba(255,255,255,${1 - p})`;
        ctx.lineWidth = 2;
        ctx.strokeRect(sx(f.x) - grow, sy((f.i + 1) * BH) - grow, f.w * scale + grow * 2, BH * scale + grow * 2);
      }
      for (const d of debris) {
        ctx.save();
        const cx = sx(d.x + d.w / 2), cy = H * 0.78 - (d.y + BH / 2 - cam) * scale;
        ctx.translate(cx, cy); ctx.rotate(d.rot);
        ctx.fillStyle = `hsl(${hueFor(d.i)},70%,45%)`;
        ctx.fillRect(-d.w * scale / 2, -BH * scale / 2, d.w * scale, BH * scale);
        ctx.restore();
      }
      if (cur) {
        ctx.shadowColor = `hsl(${hueFor(cur.i)},100%,60%)`;
        ctx.shadowBlur = 20;
        drawBlock(cur.x, cur.i, cur.w);
        ctx.shadowBlur = 0;
      }
    }
    requestAnimationFrame(frame);
  }

  reset();
  updateHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
